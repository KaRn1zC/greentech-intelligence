apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # PostgreSQL : source de verite des classifications, pour les panneaux
  # d'historique complet. Grafana et postgres sont tous deux dans Docker (dans
  # les deux modes), donc postgres:5432 fonctionne en hybride comme en full.
  # Utilisateur applicatif a droits restreints (cf. scripts/sql/init.sql).
  - name: PostgreSQL
    type: postgres
    uid: postgres
    access: proxy
    url: postgres:5432
    user: greentech_app
    secureJsonData:
      password: greentech_app_password
    jsonData:
      database: greentech_db
      sslmode: disable
      postgresVersion: 1500
    editable: true
