# =============================================================================
# GreenTech Intelligence - Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI Backend.
  # Scrape via host.docker.internal pour fonctionner dans les DEUX modes :
  #   - hybride : l'API tourne EN LOCAL sur l'hote (port 8000) ;
  #   - full Docker : le conteneur `api` publie 8000:8000, donc l'hote la sert aussi.
  # (`api:8000`, nom de service Docker, ne resolvait qu'en full Docker.)
  - job_name: 'greentech-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # MLflow
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
    scrape_interval: 30s

  # PostgreSQL (si postgres_exporter est ajouté)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s

  # Pushgateway : passerelle pour les metriques des jobs ephemere
  # (pipeline de re-entrainement Llama, scripts d'annotation, etc.).
  # Ces jobs poussent leurs metriques et Prometheus les scrape ici.
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    scrape_interval: 10s

  # cAdvisor : metriques par conteneur Docker (CPU, RAM, reseau, I/O).
  # Permet de voir la consommation de chaque service du stack.
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Alertmanager self-monitoring : expose ses propres metriques (latence des
  # notifications, nombre d'alertes routees, etat des receivers, etc.).
  # Visible dans Grafana via PromQL `alertmanager_*`.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s
